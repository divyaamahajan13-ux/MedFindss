<!DOCTYPE html>
<html>
<head>
    <title>MedFind - Register</title>
</head>
<body>

    <h1>🏥 MedFind</h1>
    <h2>Create Your Account</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="/login/">Already have an account? Login</a>
    </p>

</body>
</html>
