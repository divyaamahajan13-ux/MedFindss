<!DOCTYPE html>
<html>
<head>
    <title>Nearby Medical Stores - MedFind</title>
</head>

<body>

<h1>🏥 MedFind</h1>

<p>
    <a href="/nearby-stores/">📍 Nearby Medical Stores</a>
</p>

{% for medicine in medicines %}

    <div>
        <h3>🏪 {{ medicine.store_name }}</h3>

        <p>📍 {{ medicine.location }}</p>
        <p>💊 Medicine: {{ medicine.name }}</p>
        <p>💰 Price: ₹{{ medicine.price }}</p>
        <p>📦 Stock: {{ medicine.stock }}</p>
        <p>📞 Contact: {{ medicine.contact }}</p>

        <hr>
    </div>

{% endfor %}

<a href="/">← Back to Home</a>

</body>
</html>
